# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# TaskLens.xcodeproj is generated and not committed.
name: TaskLens

options:
  bundleIdPrefix: com.example.tasklens
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Replace with real identifiers before device builds or App Store submission.
    APP_GROUP_IDENTIFIER: group.com.example.tasklens

packages:
  TaskLensKit:
    path: Packages/TaskLensKit
  TaskLensUI:
    path: Packages/TaskLensUI

targets:
  TaskLens:
    type: application
    platform: iOS
    sources:
      - path: App/TaskLens
    info:
      path: App/TaskLens/Info.plist
      properties:
        CFBundleDisplayName: TaskLens
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        TLAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        # The in-app browser may open plain http pages the user types; the
        # rest of the app keeps App Transport Security fully on.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: App/TaskLens/TaskLens.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasklens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: TaskLensKit
        product: TLFoundation
      - package: TaskLensKit
        product: TLDomain
      - package: TaskLensKit
        product: TLData
      - package: TaskLensKit
        product: TLCoreServices
      - package: TaskLensUI
        product: TLLocalization
      - package: TaskLensUI
        product: TLDesignSystem
      - package: TaskLensUI
        product: TLNavigation
      - package: TaskLensUI
        product: CommandCenterFeature
      - package: TaskLensUI
        product: WorkspacesFeature
      - package: TaskLensUI
        product: SessionsFeature
      - package: TaskLensUI
        product: SettingsFeature
      - package: TaskLensUI
        product: LensFeature
      - package: TaskLensUI
        product: ClipboardFeature
      - package: TaskLensUI
        product: NotesFeature
      - package: TaskLensUI
        product: CalculatorFeature
      - package: TaskLensUI
        product: BrowserFeature
      - package: TaskLensUI
        product: DocumentsFeature
      - package: TaskLensUI
        product: ImageViewerFeature
      - package: TaskLensUI
        product: TextViewerFeature

  TaskLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/TaskLensTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasklens.tests
        GENERATE_INFOPLIST_FILE: YES
    # Package modules are linked into the host app only; linking them again
    # here would duplicate their types inside the test process.
    dependencies:
      - target: TaskLens

  TaskLensAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/TaskLensAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasklens.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TaskLens
    dependencies:
      - target: TaskLens

schemes:
  TaskLens:
    build:
      targets:
        TaskLens: all
        TaskLensTests: [test]
        TaskLensAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TaskLensTests
        - TaskLensAppUITests
