# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# TaskLens.xcodeproj is generated and not committed.
name: TaskLens

options:
  bundleIdPrefix: com.example.tasklens
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Replace with real identifiers before device builds or App Store submission.
    APP_GROUP_IDENTIFIER: group.com.example.tasklens

packages:
  TaskLensKit:
    path: Packages/TaskLensKit
  TaskLensUI:
    path: Packages/TaskLensUI

targets:
  TaskLens:
    type: application
    platform: iOS
    sources:
      - path: App/TaskLens
      # Intents the widget's buttons name; compiled into the widget too.
      - path: App/Shared
    info:
      path: App/TaskLens/Info.plist
      properties:
        CFBundleDisplayName: TaskLens
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        TLAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        # Lens: a photo the user takes is read on the device (localized in InfoPlist.xcstrings).
        NSCameraUsageDescription: TaskLens uses the camera only when you take a photo for Lens to read. The photo is analyzed on your device and is not uploaded.
        # tasklens:// links from widgets, App Shortcuts and Live Activities.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.tasklens
            CFBundleURLSchemes: [tasklens]
        # The in-app browser may open plain http pages the user types; the
        # rest of the app keeps App Transport Security fully on.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # "Audio, AirPlay, and Picture in Picture": required for the Picture in
        # Picture window to keep showing while TaskLens is in the background.
        # TaskLens plays no audio and does no other background work.
        UIBackgroundModes:
          - audio
          # Screen Lens (iOS 27+): the capture the user started keeps running
          # while they switch to the app they want read. It stops after one frame.
          - screen-capture
        NSScreenCaptureUsageDescription: TaskLens reads one frame of the screen you choose, only after you tap Start and Capture. It is read on your device and not saved or uploaded.
        # Session Live Activities (Lock Screen, and the Dynamic Island where present).
        NSSupportsLiveActivities: true
    entitlements:
      path: App/TaskLens/TaskLens.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasklens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Translation (iOS 17.4+) is weak-linked so the app still runs on iOS 17.0.
        OTHER_LDFLAGS: "$(inherited) -weak_framework Translation"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TASKLENS_APP"
    dependencies:
      - target: TaskLensShare
      - target: TaskLensWidgets
      - package: TaskLensKit
        product: TLFoundation
      - package: TaskLensKit
        product: TLDomain
      - package: TaskLensKit
        product: TLData
      - package: TaskLensKit
        product: TLCoreServices
      - package: TaskLensUI
        product: TLLocalization
      - package: TaskLensUI
        product: TLDesignSystem
      - package: TaskLensUI
        product: TLNavigation
      - package: TaskLensUI
        product: CommandCenterFeature
      - package: TaskLensUI
        product: WorkspacesFeature
      - package: TaskLensUI
        product: SessionsFeature
      - package: TaskLensUI
        product: SettingsFeature
      - package: TaskLensUI
        product: AIFeature
      - package: TaskLensUI
        product: WorkflowsFeature
      - package: TaskLensUI
        product: LensFeature
      - package: TaskLensUI
        product: ClipboardFeature
      - package: TaskLensUI
        product: NotesFeature
      - package: TaskLensUI
        product: CalculatorFeature
      - package: TaskLensUI
        product: BrowserFeature
      - package: TaskLensUI
        product: DocumentsFeature
      - package: TaskLensUI
        product: ImageViewerFeature
      - package: TaskLensUI
        product: TextViewerFeature
      - package: TaskLensUI
        product: PresentationFeature
      - package: TaskLensUI
        product: TLPowerPointRendering
      - package: TaskLensUI
        product: TLActionsUI
      - package: TaskLensUI
        product: ShareFeature
      - package: TaskLensUI
        product: PiPFeature
      - package: TaskLensUI
        product: WidgetsFeature
      - package: TaskLensUI
        product: LiveActivitiesFeature

  # Share extension: accepts text, links, images, PDFs and other files.
  TaskLensShare:
    type: app-extension
    platform: iOS
    sources:
      - path: App/TaskLensShare
    info:
      path: App/TaskLensShare/Info.plist
      properties:
        CFBundleDisplayName: TaskLens
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    entitlements:
      path: App/TaskLensShare/TaskLensShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasklens.share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: "$(inherited) -weak_framework Translation"
    dependencies:
      - package: TaskLensKit
        product: TLFoundation
      - package: TaskLensKit
        product: TLDomain
      - package: TaskLensKit
        product: TLData
      - package: TaskLensKit
        product: TLCoreServices
      - package: TaskLensUI
        product: TLLocalization
      - package: TaskLensUI
        product: TLDesignSystem
      - package: TaskLensUI
        product: TLActionsUI
      - package: TaskLensUI
        product: ShareFeature

  # Home Screen widget: small = quick actions, medium = recent sessions,
  # large = workspace + recent sessions. Reads the app's snapshot file only.
  TaskLensWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/TaskLensWidgets
      - path: App/Shared
      - path: App/TaskLens/Resources/Localizable.xcstrings
    info:
      path: App/TaskLensWidgets/Info.plist
      properties:
        CFBundleDisplayName: TaskLens
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/TaskLensWidgets/TaskLensWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasklens.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: TaskLensKit
        product: TLFoundation
      - package: TaskLensKit
        product: TLDomain
      - package: TaskLensKit
        product: TLCoreServices
      - package: TaskLensUI
        product: TLLocalization
      - package: TaskLensUI
        product: TLDesignSystem
      - package: TaskLensUI
        product: TLNavigation
      - package: TaskLensUI
        product: WidgetsFeature

  TaskLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/TaskLensTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasklens.tests
        GENERATE_INFOPLIST_FILE: YES
    # Package modules are linked into the host app only; linking them again
    # here would duplicate their types inside the test process.
    dependencies:
      - target: TaskLens

  TaskLensAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/TaskLensAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasklens.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TaskLens
    dependencies:
      - target: TaskLens

schemes:
  TaskLens:
    build:
      targets:
        TaskLens: all
        TaskLensShare: all
        TaskLensWidgets: all
        TaskLensTests: [test]
        TaskLensAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TaskLensTests
        - TaskLensAppUITests
