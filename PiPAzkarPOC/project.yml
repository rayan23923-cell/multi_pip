# Fallback only: if the .xcodeproj does not open, run `brew install xcodegen && xcodegen` here.
name: IslamicPiPPOC
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  IslamicPiPPOC:
    type: application
    platform: iOS
    sources: [IslamicPiPPOC]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IslamicPiPPOC
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
