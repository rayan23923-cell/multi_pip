name: CI

# Runs when started by hand (Actions tab or API) at the end of each phase.
# Builds app + extension and runs unit tests and, by default, UI tests
# (XCUITest). Set `ui_tests` to false for a quicker build-only check.
on:
  workflow_dispatch:
    inputs:
      ui_tests:
        description: Run XCUITests on the app
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iPhone 11 simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test
        run: scripts/ci.sh
        env:
          UI_TESTS: ${{ inputs.ui_tests }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs
          if-no-files-found: ignore
