name: CI

# Runs only when started by hand (Actions tab or API), to save macOS minutes.
# Every phase: build app + extension and run unit tests. UI tests (XCUITest)
# run when `ui_tests` is true, every few phases and before release.
on:
  workflow_dispatch:
    inputs:
      ui_tests:
        description: Run XCUITests on the app
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iPhone 11 simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test
        run: scripts/ci.sh
        env:
          UI_TESTS: ${{ inputs.ui_tests }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs
          if-no-files-found: ignore
