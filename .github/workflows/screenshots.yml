name: Screenshots

# Started by hand. Captures the main screens on an iPhone 11 simulator and
# commits them to docs/screenshots on the same branch.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshots (iPhone 11 simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Capture
        run: scripts/screenshots.sh

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Screenshots from ${GITHUB_SHA::7}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-logs
          path: build/logs
          if-no-files-found: ignore
